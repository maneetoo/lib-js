name = "maneetoo/promise"
description = "Promise implementation with then, catch, finally, and static combinators."
version = "1.0.0"
license = "MIT"
authors = ["maneetoo"]
repository = "https://github.com/maneetoo/lib-js"

includes = [
  "pesde.toml",
  "LICENSE",
  "README.md",
  "src/**/*.luau",
]

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"

[dependencies]
ES17-Types = { workspace = "maneetoo/es17types", version = "^"  }
Error = { workspace = "maneetoo/error", version = "^"  }
Symbol = { workspace = "maneetoo/symbol", version = "^"  }