name = "maneetoo/math"
description = "Mathematical constants and functions matching the JavaScript Math object."
version = "1.0.0"
license = "MIT"
authors = ["maneetoo"]
repository = "https://github.com/maneetoo/lib-js"

includes = [
  "pesde.toml",
  "LICENSE",
  "README.md",
  "src/**/*.luau",
]

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"

[dependencies]
ECMAScript = { workspace = "maneetoo/ecmascript", version = "^"  }
Number = { workspace = "maneetoo/number", version = "^"  }
Symbol = { workspace = "maneetoo/symbol", version = "^"  }