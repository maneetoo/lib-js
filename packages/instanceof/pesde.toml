name = "maneetoo/instanceof"
description = "Checks whether an object's prototype chain includes a constructor's prototype."
version = "1.0.0"
license = "MIT"
authors = ["maneetoo"]
repository = "https://github.com/maneetoo/lib-js"

includes = [
  "pesde.toml",
  "LICENSE",
  "README.md",
  "src/**/*.luau",
]

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"

[dependencies]
ES17-Types = { workspace = "maneetoo/es17types", version = "^"  }