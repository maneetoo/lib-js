name = "maneetoo/timers"
description = "Timer functions: setTimeout, setInterval, setImmediate, and their clear counterparts."
version = "1.0.0"
license = "MIT"
authors = ["maneetoo"]
repository = "https://github.com/maneetoo/lib-js"

includes = [
  "pesde.toml",
  "LICENSE",
  "README.md",
  "src/**/*.luau",
]

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"

[dependencies]
Error = { workspace = "maneetoo/error", version = "^"  }
Number = { workspace = "maneetoo/number", version = "^"  }