name = "maneetoo/libjs"
description = "Everything what you need to write code in Luau with JS built-in objects"
version = "1.0.0"
license = "MIT"
authors = ["maneetoo"]
repository = "https://github.com/maneetoo/lib-js"

includes = [
  ".github/*",
  "pesde.toml",
  "README.md",
  "LICENSE",
  "src/**/*.luau",
]

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"

[dependencies]
Array = { workspace = "maneetoo/array", version = "^"  }
Boolean = { workspace = "maneetoo/boolean", version = "^"  }
ES17-Types = { workspace = "maneetoo/es17types", version = "^"  }
Error = { workspace = "maneetoo/error", version = "^"  }
JSON = { workspace = "maneetoo/json", version = "^"  }
Map = { workspace = "maneetoo/map", version = "^"  }
Math = { workspace = "maneetoo/math", version = "^"  }
Number = { workspace = "maneetoo/number", version = "^"  }
Object = { workspace = "maneetoo/object", version = "^"  }
Promise = { workspace = "maneetoo/promise", version = "^"  }
Set = { workspace = "maneetoo/set", version = "^"  }
String = { workspace = "maneetoo/string", version = "^"  }
Symbol = { workspace = "maneetoo/symbol", version = "^"  }
Timers = { workspace = "maneetoo/timers", version = "^"  }
WeakMap = { workspace = "maneetoo/weakmap", version = "^"  }
WeakSet = { workspace = "maneetoo/weakset", version = "^"  }
WeakRef = { workspace = "maneetoo/weakref", version = "^"  }
globalThis = { workspace = "maneetoo/globalthis", version = "^"  }
instanceof = { workspace = "maneetoo/instanceof", version = "^"  }
iterate = { workspace = "maneetoo/iterate", version = "^"  }