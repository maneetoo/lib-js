[package]
name = "maneetoo/libjs"
description = "Everything what you need to write code in Luau with JS built-in objects"
version = "1.0.3"
license = "MIT"
authors = ["maneetoo"]
registry = "https://github.com/UpliftGames/wally-index"
repository = "https://github.com/maneetoo/lib-js"
realm = "shared"

[dependencies]
Array = "maneetoo/array@1.0.3"
Boolean = "maneetoo/boolean@1.0.3"
ECMAScript = "maneetoo/ecmascript@1.0.3"
ES17-Types = "maneetoo/es17types@1.0.3"
Error = "maneetoo/error@1.0.3"
JSON = "maneetoo/json@1.0.3"
Map = "maneetoo/map@1.0.3"
Math = "maneetoo/math@1.0.3"
Number = "maneetoo/number@1.0.3"
Object = "maneetoo/object@1.0.3"
Promise = "maneetoo/promise@1.0.3"
Set = "maneetoo/set@1.0.3"
String = "maneetoo/string@1.0.3"
Symbol = "maneetoo/symbol@1.0.3"
Timers = "maneetoo/timers@1.0.3"
WeakMap = "maneetoo/weakmap@1.0.3"
WeakSet = "maneetoo/weakset@1.0.3"
WeakRef = "maneetoo/weakref@1.0.3"
globalThis = "maneetoo/globalthis@1.0.3"
instanceof = "maneetoo/instanceof@1.0.3"
iterate = "maneetoo/iterate@1.0.3"