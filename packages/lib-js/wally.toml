[package]
name = "maneetoo/libjs"
description = "Everything what you need to write code in Luau with JS built-in objects"
version = "2.0.0"
license = "MIT"
authors = ["maneetoo"]
registry = "https://github.com/UpliftGames/wally-index"
repository = "https://github.com/maneetoo/lib-js"
realm = "shared"

[dependencies]
Array = "maneetoo/array@2.0.0"
Boolean = "maneetoo/boolean@2.0.0"
ECMAScript = "maneetoo/ecmascript@2.0.0"
ES17-Types = "maneetoo/es17types@2.0.0"
Error = "maneetoo/error@2.0.0"
JSON = "maneetoo/json@2.0.0"
Map = "maneetoo/map@2.0.0"
Math = "maneetoo/math@2.0.0"
Number = "maneetoo/number@2.0.0"
Object = "maneetoo/object@2.0.0"
Promise = "maneetoo/promise@2.0.0"
Set = "maneetoo/set@2.0.0"
String = "maneetoo/string@2.0.0"
Symbol = "maneetoo/symbol@2.0.0"
Timers = "maneetoo/timers@2.0.0"
WeakMap = "maneetoo/weakmap@2.0.0"
WeakSet = "maneetoo/weakset@2.0.0"
WeakRef = "maneetoo/weakref@2.0.0"
globalThis = "maneetoo/globalthis@2.0.0"
instanceof = "maneetoo/instanceof@2.0.0"
iterate = "maneetoo/iterate@2.0.0"
queueMicrotask = "maneetoo/queuemicrotask@2.0.0"
structuredClone = "maneetoo/structuredclone@2.0.0"
uri = "maneetoo/uri@2.0.0"
atob = "maneetoo/atob@2.0.0"
abort = "maneetoo/abort@2.0.0"
btoa = "maneetoo/btoa@2.0.0"
events = "maneetoo/events@2.0.0"
util = "maneetoo/util@2.0.0"
