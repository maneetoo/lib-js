[package]
name = "maneetoo/libjs"
description = "Everything what you need to write code in Luau with JS built-in objects"
version = "2.0.0-rc.2"
license = "MIT"
authors = ["maneetoo"]
registry = "https://github.com/UpliftGames/wally-index"
repository = "https://github.com/maneetoo/lib-js"
realm = "shared"

[dependencies]
Array = "maneetoo/array@2.0.0-rc.2"
Boolean = "maneetoo/boolean@2.0.0-rc.2"
ECMAScript = "maneetoo/ecmascript@2.0.0-rc.2"
ES17-Types = "maneetoo/es17types@2.0.0-rc.2"
Error = "maneetoo/error@2.0.0-rc.2"
JSON = "maneetoo/json@2.0.0-rc.2"
Map = "maneetoo/map@2.0.0-rc.2"
Math = "maneetoo/math@2.0.0-rc.2"
Number = "maneetoo/number@2.0.0-rc.2"
Object = "maneetoo/object@2.0.0-rc.2"
Promise = "maneetoo/promise@2.0.0-rc.2"
Set = "maneetoo/set@2.0.0-rc.2"
String = "maneetoo/string@2.0.0-rc.2"
Symbol = "maneetoo/symbol@2.0.0-rc.2"
Timers = "maneetoo/timers@2.0.0-rc.2"
WeakMap = "maneetoo/weakmap@2.0.0-rc.2"
WeakSet = "maneetoo/weakset@2.0.0-rc.2"
WeakRef = "maneetoo/weakref@2.0.0-rc.2"
globalThis = "maneetoo/globalthis@2.0.0-rc.2"
atob-btoa = "maneetoo/atobbtoa@2.0.0-rc.2"
abort = "maneetoo/abort@2.0.0-rc.2"
events = "maneetoo/events@2.0.0-rc.2"
instanceof = "maneetoo/instanceof@2.0.0-rc.2"
iterate = "maneetoo/iterate@2.0.0-rc.2"