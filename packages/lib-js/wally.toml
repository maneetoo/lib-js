[package]
name = "maneetoo/libjs"
description = "Everything what you need to write code in Luau with JS built-in objects"
version = "2.0.0-rc.1"
license = "MIT"
authors = ["maneetoo"]
registry = "https://github.com/UpliftGames/wally-index"
repository = "https://github.com/maneetoo/lib-js"
realm = "shared"

[dependencies]
Array = "maneetoo/array@2.0.0-rc.1"
Boolean = "maneetoo/boolean@2.0.0-rc.1"
ECMAScript = "maneetoo/ecmascript@2.0.0-rc.1"
ES17-Types = "maneetoo/es17types@2.0.0-rc.1"
Error = "maneetoo/error@2.0.0-rc.1"
JSON = "maneetoo/json@2.0.0-rc.1"
Map = "maneetoo/map@2.0.0-rc.1"
Math = "maneetoo/math@2.0.0-rc.1"
Number = "maneetoo/number@2.0.0-rc.1"
Object = "maneetoo/object@2.0.0-rc.1"
Promise = "maneetoo/promise@2.0.0-rc.1"
Set = "maneetoo/set@2.0.0-rc.1"
String = "maneetoo/string@2.0.0-rc.1"
Symbol = "maneetoo/symbol@2.0.0-rc.1"
Timers = "maneetoo/timers@2.0.0-rc.1"
WeakMap = "maneetoo/weakmap@2.0.0-rc.1"
WeakSet = "maneetoo/weakset@2.0.0-rc.1"
WeakRef = "maneetoo/weakref@2.0.0-rc.1"
globalThis = "maneetoo/globalthis@2.0.0-rc.1"
instanceof = "maneetoo/instanceof@2.0.0-rc.1"
iterate = "maneetoo/iterate@2.0.0-rc.1"