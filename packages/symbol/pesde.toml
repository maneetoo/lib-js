name = "maneetoo/symbol"
description = "Symbol constructor, well-known symbols, and symbol registry functions."
version = "1.0.2"
license = "MIT"
authors = ["maneetoo"]
repository = "https://github.com/maneetoo/lib-js"

includes = [
  "pesde.toml",
  "LICENSE",
  "README.md",
  "src/**/*.luau",
]

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"