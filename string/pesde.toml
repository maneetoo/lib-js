name = "maneetoo/string"
description = "String constructor and prototype methods following JavaScript string semantics."
version = "1.0.0"
license = "MIT"
authors = ["maneetoo"]
repository = "https://github.com/maneetoo/lib-js"

includes = [
  "pesde.toml",
  "LICENSE",
  "README.md",
  "src/**/*.luau",
]

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"

[dependencies]
ECMAScript = { workspace = "maneetoo/ecmascript", version = "^"  }
ES17-Types = { workspace = "maneetoo/es17types", version = "^"  }
Number = { workspace = "maneetoo/number", version = "^"  }
Object = { workspace = "maneetoo/object", version = "^"  }
Symbol = { workspace = "maneetoo/symbol", version = "^"  }