name: Delete pesde.toml files
 
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
 
permissions:
  contents: write
 
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Delete pesde.toml files
        run: |
          find . -type f -name "pesde.toml" \
            -not -path "./.git/*" \
            -print -delete
 
      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: remove pesde.toml files [skip ci]"
            git push
          else
            echo "Nothing to delete."
          fi
