name: Delete Ignored Files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete *.lock and sourcemap.json files
        run: |
          find . -type f \( -name "*.lock" -o -name "sourcemap.json" \) \
            -not -path "./.git/*" \
            -print -delete

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: remove .lock and sourcemap.json files [skip ci]"
            git push
          else
            echo "Nothing to delete."
          fi
